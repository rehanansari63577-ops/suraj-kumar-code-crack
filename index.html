<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR KING Website Builder</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--line:#2a3a52;--gold:#f7c948;--text:#edf3ff;--muted:#aab8ce;--green:#35c78a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Devanagari",sans-serif}
header{padding:22px 16px;background:linear-gradient(120deg,#102e4b,#173d36);border-bottom:3px solid var(--gold);text-align:center}
header h1{margin:0;color:var(--gold);font-size:clamp(25px,5vw,38px)}header p{margin:8px 0 0;color:var(--muted)}
main{max-width:1400px;margin:auto;padding:16px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
button,.file-label{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--gold);color:#172033}
button.secondary,.file-label.secondary{background:#24344b;color:var(--text);border:1px solid #3a4c65}button.green{background:var(--green);color:#06281b}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:bold}
textarea{display:block;width:100%;min-height:430px;resize:vertical;border:0;outline:0;background:#08101c;color:#d9e8ff;padding:16px;font:14px/1.6 Consolas,Monaco,monospace}
iframe{display:block;width:100%;height:480px;background:#fff;border:0}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.note{color:var(--muted);font-size:13px;line-height:1.6;margin:14px 2px}#status{color:var(--green);font-size:13px}
@media(max-width:800px){.workspace{grid-template-columns:1fr}textarea{min-height:300px}iframe{height:390px}}
</style>
</head>
<body>
<header><h1>STAR KING Website Builder</h1><p>कोड लिखो • Run दबाओ • अपनी वेबसाइट का Preview देखो</p></header>
<main>
<div class="toolbar">
<button id="run" class="green">▶ Run / Preview</button><button id="download">⬇ HTML डाउनलोड</button><button id="copy" class="secondary">कोड कॉपी</button><button id="example" class="secondary">डेमो कोड वापस लाओ</button><label class="file-label secondary" for="upload">HTML फ़ाइल खोलो</label><input id="upload" type="file" accept=".html,.htm,text/html" hidden>
</div>
<div class="workspace">
<section class="panel"><div class="panel-head"><span>🧑‍💻 HTML कोड एडिटर</span><small>index.html</small></div>
<textarea id="code" spellcheck="false" aria-label="HTML code editor"><!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरी पहली वेबसाइट</title>
<style>
body{font-family:Arial,sans-serif;text-align:center;padding:35px 15px;background:#eef6ff;color:#17324d}
.card{max-width:520px;margin:auto;padding:28px;background:white;border-radius:18px;box-shadow:0 8px 25px #0002}
h1{color:#0759a5}button{padding:12px 18px;background:#ffca28;border:0;border-radius:9px;font-weight:bold;cursor:pointer}
</style>
</head>
<body><div class="card"><h1>मेरी पहली वेबसाइट 🎉</h1><p>मैं STAR KING Website Builder से अपनी वेबसाइट बना रहा हूँ!</p><button onclick="alert('बहुत बढ़िया! आपका बटन काम कर रहा है।')">मुझे क्लिक करो</button></div></body>
</html></textarea></section>
<section class="panel"><div class="panel-head"><span>🌐 Live Preview</span><span id="status">तैयार</span></div><iframe id="preview" title="वेबसाइट प्रीव्यू" sandbox="allow-scripts"></iframe></section>
</div>
<p class="note">बाईं तरफ कोड बदलो और Run / Preview दबाओ। HTML डाउनलोड से फ़ाइल सेव कर सकते हो। यह शुरुआती कोड एडिटर है; इंटरनेट पर प्रकाशित करने के लिए होस्टिंग चाहिए।</p>
</main>
<script>
const editor=document.getElementById('code'),preview=document.getElementById('preview'),statusText=document.getElementById('status'),starter=editor.value;
function runCode(){preview.srcdoc=editor.value;statusText.textContent='Preview अपडेट हुआ'}
document.getElementById('run').addEventListener('click',runCode);
document.getElementById('download').addEventListener('click',()=>{const blob=new Blob([editor.value],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(editor.value);statusText.textContent='कोड कॉपी हो गया'}catch(e){editor.focus();editor.select();statusText.textContent='Ctrl+C दबाकर कॉपी करें'}});
document.getElementById('example').addEventListener('click',()=>{editor.value=starter;runCode()});
document.getElementById('upload').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;editor.value=await file.text();runCode();e.target.value=''});
runCode();
</script>
</body>
</html>
